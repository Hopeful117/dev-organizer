<h2>{{title}}</h2>
<h3>Filter</h3>
<div class="filter-bar">
  <button class="action-button" (click)="putSelectedType('ALL')" [class.active]="selectType() === 'ALL'">ALL</button>
  <button class="action-button" (click)="putSelectedType('IDEA')" [class.active]="selectType() === 'IDEA'">IDEA</button>
  <button class="action-button" (click)="putSelectedType('TASK')" [class.active]="selectType() === 'TASK'">TASK</button>
  <button class="action-button" (click)="putSelectedType('NOTE')" [class.active]="selectType() === 'NOTE'">NOTE</button>
</div>
@for (item of filteredItems() ; track item.id) {
<app-workspace-item [item]="item" (accept)="onAccept($event)" (deleteItem)="onDeleteItem($event)"
                    (start)="onStart($event)" (done)="onDone($event)" ></app-workspace-item>


}
<input
  type="text"
  [(ngModel)]="newItemTitle"
  placeholder="Title">

<textarea
  id="description" name="description" rows="5" cols="33"
  [(ngModel)]="newItemDescription"
  placeholder="Description"></textarea>

<div class="itemSelect">
<label for="itemType">Type</label>

<select id="itemType" name="itemType" [(ngModel)]="newItemType">
  <option value="IDEA">Idea</option>
  <option value="TASK">Task</option>
  <option value="NOTE">Note</option>

</select>

</div>

<button (click)="addItem()">Add item</button>
