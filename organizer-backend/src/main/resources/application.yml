server:
  address: 0.0.0.0
  port: ${ORGANIZER_PORT:14080}

devlog:
  base-url: ${DEVLOG_BASE_URL:http://127.0.0.1:18080}

spring:
  datasource:
    url: ${ORGANIZER_DB_URL:jdbc:postgresql://localhost:15432/organizer}
    username: ${ORGANIZER_DB_USERNAME:organizer}
    password: ${ORGANIZER_DB_PASSWORD:organizer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
